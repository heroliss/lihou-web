services:
  - type: web
    name: lihou-web-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements/public-demo.txt
    startCommand: python manage.py prepare-public-demo && gunicorn --workers 1 --threads 2 --bind 0.0.0.0:$PORT manage:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: FLASK_CONFIG
        value: public-demo
      - key: SECRET_KEY
        generateValue: true
      - key: LIHOU_DEMO_DIR
        value: /tmp/lihou-demo
      - key: LIHOU_PROXY_HOPS
        value: "1"
